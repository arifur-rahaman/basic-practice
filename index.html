<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Images/Client1_LogoPalette2_014038.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Bloom Valley</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <nav class="nav">
        <img
          class="logo"
          src="Images/Client1_LogoPalette2_014038.png"
          alt="logo"
        />

        <!-- Hamburger -->
        <div class="hamburger" id="hamburger" aria-label="Menu">☰</div>

        <!-- Links -->
        <div class="nav-links" id="nav-links">
          <a href="index.html">Home</a>
          <a href="gallery.html">Gallery</a>
          <a href="about-us.html">About Us</a>
          <a href="custom-order.html">Custom</a>
        </div>
      </nav>
    </header>

    <!-- Main Section -->
    <main class="container">
      <!-- Hero / Top Section -->
      <section class="hero">
        <img src="Images/Client1_StringofPearls.png" alt="Hero Image" />
        <h1>Welcome to Bloom Valley</h1>
      </section>

      <!-- Gallery Section -->
      <section class="grid">
        <h2 class="section-title">Gallery</h2>
        <div class="cards">
          <div class="card">
            <img src="Images/Client1_AloePlant.png" alt="Image" />
          </div>
          <div class="card">
            <img src="Images/Client1_AppleTree.png" alt="Image" />
          </div>
          <div class="card">
            <img src="Images/Client1_BirchTree.png" alt="Image" />
          </div>
          <div class="card">
            <img src="Images/Client1_StringofPearls.png" alt="Image" />
          </div>
          <div class="card">
            <img src="Images/Client1_WateringCan.png" alt="Image" />
          </div>
          <div class="card">
            <img src="Images/Client1_MapleTree.png" alt="Image" />
          </div>
          <div class="card">
            <img src="Images/Client1_BirdHouse.png" alt="Image" />
          </div>
          <div class="card">
            <img src="Images/Client1_SpiderPlant.png" alt="Image" />
          </div>
        </div>
      </section>

      <!-- Contact & Subscribe -->
      <section class="actions">
        <!-- Contact Form -->
        <div id="contact" class="contact-form">
          <h2>Contact Us</h2>
          <form id="contact-form" action="submit_form.php" method="post">
            <label for="name">Name:</label><br />
            <input type="text" id="name" name="name" required /><br /><br />

            <label for="email">Email:</label><br />
            <input type="email" id="email" name="email" required /><br /><br />

            <label for="subject">Subject:</label><br />
            <input type="text" id="subject" name="subject" /><br /><br />

            <label for="message">Message:</label><br />
            <textarea id="message" name="message" rows="5" required></textarea
            ><br /><br />

            <button type="submit">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <!-- footer -->

    <footer class="footer">
      <p>© Bloom Valley 2026</p>

      <!-- Subscribe Box -->
      <form class="subscribe-box" novalidate>
        <div class="subscribe-field">
          <input
            type="email"
            name="subs"
            id="subscribe"
            placeholder="Enter your email"
            required
          />
          <span class="tooltip"
            >Please enter a valid email (example@domain.com)</span
          >
        </div>

        <button type="button" class="subscribe-btn">Subscribe</button>
      </form>

      <div class="social-icons">
        <a href="https://facebook.com" target="_blank"
          ><i class="fab fa-facebook-f"></i
        ></a>
        <a href="https://twitter.com" target="_blank"
          ><i class="fab fa-twitter"></i
        ></a>
        <a href="https://instagram.com" target="_blank"
          ><i class="fab fa-instagram"></i
        ></a>
        <a href="https://linkedin.com" target="_blank"
          ><i class="fab fa-linkedin-in"></i
        ></a>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
