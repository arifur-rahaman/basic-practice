<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="Images/Client1_LogoPalette2_014038.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Bloom Valley</title>
  </head>
  <body>
    <nav>
      <img
        class="logo"
        src="Images/Client1_LogoPalette2_014038.png"
        alt="logo"
      />
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="about-us.html">About Us</a>
      <a href="custom-order.html">Custom</a>
    </nav>

    <main class="container">
      <section id="custom" class="section">
        <h2>Custom Order</h2>
        <div class="custom-grid">
          <div>
            <img src="Images/Client1_AppleTree.png" alt="Custom Image 1" />
            <button class="add-to-cart">Add to Cart</button>
            <button class="clear-cart">Clear Cart</button>
            <button class="process-order">Process Order</button>
          </div>
          <div>
            <img src="Images/Client1_MapleTree.png" alt="Custom Image 2" />
            <button class="add-to-cart">Add to Cart</button>
            <button class="clear-cart">Clear Cart</button>
            <button class="process-order">Process Order</button>
          </div>
        </div>
      </section>

      <!-- Action Buttons -->
      <section class="actions">
        <div id="contact" class="contact-form">
          <h2>Contact Us</h2>
          <form id="contact-form" action="submit_form.php" method="post">
            <label for="name">Name:</label><br />
            <input type="text" id="name" name="name" required /><br /><br />

            <label for="email">Email:</label><br />
            <input type="email" id="email" name="email" required /><br /><br />

            <label for="subject">Subject:</label><br />
            <input type="text" id="subject" name="subject" /><br /><br />

            <label for="message">Message:</label><br />
            <textarea id="message" name="message" rows="5" required></textarea
            ><br /><br />

            <button type="submit">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <!-- footer -->

    <footer class="footer">
      <p>© Bloom Valley 2026</p>

      <!-- Subscribe Box -->
      <form class="subscribe-box" novalidate>
        <div class="subscribe-field">
          <input
            type="email"
            name="subs"
            id="subscribe"
            placeholder="Enter your email"
            required
          />
          <span class="tooltip"
            >Please enter a valid email (example@domain.com)</span
          >
        </div>

        <button type="button" class="subscribe-btn">Subscribe</button>
      </form>

      <div class="social-icons">
        <a href="https://facebook.com" target="_blank"
          ><i class="fab fa-facebook-f"></i
        ></a>
        <a href="https://twitter.com" target="_blank"
          ><i class="fab fa-twitter"></i
        ></a>
        <a href="https://instagram.com" target="_blank"
          ><i class="fab fa-instagram"></i
        ></a>
        <a href="https://linkedin.com" target="_blank"
          ><i class="fab fa-linkedin-in"></i
        ></a>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
